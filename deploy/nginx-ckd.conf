# /etc/nginx/conf.d/ckd.conf
# This is a copy of the live nginx config on the shared EC2 box (40.192.86.150), kept here for
# reference/history — the file that actually matters is the one on the server. Documented in
# THIS repo (not ckd-next-frontend) because this app's deploy added the /logistics block; the
# rest of the file is unchanged and was already documented in ckd-next-frontend's own
# deploy/nginx-ckd.conf before this app existed.
#
# This domain fronts three frontends now: /ckd (ckd-next-frontend, PM2 "ckd-frontend", :3000),
# /logistics (this app, PM2 "logistics-frontend", :3001), and /jockeydeployment (the old
# spaceage app, a completely separate EC2 at 16.112.228.159). /ckd and /logistics are two
# independent Next.js deployments that both call the SAME already-deployed Logistics-backend
# on :5000 via the shared /api location below — no new backend, no DNS/GoDaddy changes (this
# is all path-based routing on the domain's existing A record, not a new subdomain).
map $http_referer $api_backend {
    default                "http://127.0.0.1:5000";
    "~*/jockeydeployment"  "https://16.112.228.159";
}

server {
    listen 80;
    server_name spaceageconnect.com www.spaceageconnect.com;
    location /.well-known/acme-challenge/ { root /var/www/acme-challenge; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name spaceageconnect.com www.spaceageconnect.com;

    ssl_certificate     /etc/nginx/ssl/spaceageconnect.crt;
    ssl_certificate_key /etc/nginx/ssl/spaceageconnect.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Backend API — shared by /ckd and /logistics alike (routed by Referer only to split off
    # the legacy /jockeydeployment app onto its own separate backend).
    location /api {
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Deliberately NOT forwarding the client's Expect header: nginx already answers
        # 100-continue to the client itself and buffers the full body before opening the
        # upstream connection. Forwarding Expect on top of that made Tomcat wait for its
        # own continue handshake that nginx's proxy layer never relays back, deadlocking
        # the connection indefinitely on real multi-MB uploads.
        # Matches spring.servlet.multipart.max-file-size/max-request-size — must be >=
        # the backend's own limit, otherwise nginx accepts what Spring then rejects anyway.
        client_max_body_size 20M;
        # Real phone-camera photos are usually a few MB — without this, anything bigger
        # than nginx's tiny default in-memory buffer (8-16k) spills to a temp file on
        # disk, and that combined with Expect:100-continue reliably triggers a 417
        # instead of proceeding. Keeping the whole body in memory avoids that path.
        client_body_buffer_size 20M;
    }

    # CKD Frontend (Next.js, basePath already /ckd — PM2 "ckd-frontend" on :3000)
    location /ckd {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Logistics Frontend (Next.js, basePath /logistics — PM2 "logistics-frontend" on :3001).
    # Separate deployment from /ckd above, same shared backend via /api.
    location /logistics {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Old spaceage app — still running on its own EC2, proxied through here
    # since the domain now points at this server instead.
    location /jockeydeployment {
        proxy_pass https://16.112.228.159;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Root → app
    location = / {
        return 301 https://$host/ckd;
    }
}
